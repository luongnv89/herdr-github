id = "herdr-github"
name = "Herdr GitHub"
version = "0.5.0"
min_herdr_version = "0.9.5"
description = "The current repo's open pull requests and issues from GitHub or GitLab, in a side pane."
platforms = ["linux", "macos"]

[[actions]]
id = "toggle"
title = "Toggle PR and issue panel"
contexts = ["workspace"]
command = ["node", "toggle.js"]

[[panes]]
id = "panel"
title = "PRs & issues"
placement = "split"
command = ["node", "panel.js"]

[[actions]]
id = "bind-key"
title = "Bind a key to the PR and issue panel"
contexts = ["workspace"]
command = ["node", "bind-key.js"]
